[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skysentry"
version = "0.1.0"
description = "High-resolution small-object detection & trajectory tracking pipeline (P2 stride-4 head, NWD loss, Kalman tracking, sim-to-real evaluation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkySentry" }]
keywords = ["object-detection", "tiny-objects", "uav", "tracking", "wasserstein", "domain-adaptation"]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python>=4.8",
    "albumentations>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "filterpy>=1.4.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
skysentry-dryrun = "train_step_dryrun:main"

[tool.setuptools]
packages = ["models", "losses", "tracking", "evaluation", "data", "configs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
